<svg xmlns="http://www.w3.org/2000/svg" width="900" height="211" viewBox="0 0 900 211" role="img" aria-labelledby="title desc"><title id="title">Maximum advertising cost per click</title><desc id="desc">5 percent requests per entry click times 50 percent payable requests times 18 euros retained per paid lead, less 0.10 euros other cost per click, leaves 0.35 euros for advertising.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="209" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">Maximum advertising cost per click</text><rect x="20" y="44" width="860" height="58" rx="9" fill="#173247"/><text x="95" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">5%</text><text x="180" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">×</text><text x="280" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">50%</text><text x="365" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">×</text><text x="455" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">€18</text><text x="545" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">−</text><text x="635" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">€0.10</text><text x="720" y="85" text-anchor="middle" font-size="38" fill="#ffffff" font-weight="700">=</text><text x="810" y="85" text-anchor="middle" font-size="38" fill="#9be7dc" font-weight="700">€0.35</text><path d="M95,105 L95,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="95" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="8.0" data-max-x="182.0"><text x="95" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Requests / clicks</text><text x="95" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">50 / 1,000</text></g><path d="M280,105 L280,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="280" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="193.0" data-max-x="367.0"><text x="280" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Payable / requests</text><text x="280" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">25 / 50</text></g><path d="M455,105 L455,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="455" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="368.0" data-max-x="542.0"><text x="455" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Retained / paid lead</text><text x="455" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">After fee deductions</text></g><path d="M635,105 L635,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="635" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="548.0" data-max-x="722.0"><text x="635" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Other service cost</text><text x="635" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per entry click</text></g><path d="M810,105 L810,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="810" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="723.0" data-max-x="897.0"><text x="810" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Ad cost ceiling</text><text x="810" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per click; no overhead</text></g><text x="450" y="193" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">Extra introduction, setup or onboarding costs leave less available for advertising.</text></g></svg>
