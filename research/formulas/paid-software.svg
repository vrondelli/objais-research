<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315" role="img" aria-labelledby="title desc"><title id="title">Paid software follows its own billing clock</title><desc id="desc">Software monthly contribution is paid-start share times original owners times billing continuation to age a times net price less extra account cost. Month 2 gives 356.25 euros, before acquisition, shared costs and fixed overhead.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="313" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">Paid software follows its own billing clock</text><rect x="20" y="100" width="860" height="58" rx="9" fill="#173247"/><text x="100" y="141" text-anchor="middle" font-size="36" fill="#9be7dc" font-weight="700">C<tspan baseline-shift="super" font-size="20.88">S</tspan></text><text x="193" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">=</text><text x="252" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">κ</text><text x="310" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="365" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">A</text><text x="425" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="480" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">η<tspan baseline-shift="super" font-size="20.88">a</tspan></text><text x="555" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="589" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">(</text><text x="620" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">b</text><text x="669" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">−</text><text x="728" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">v<tspan baseline-shift="sub" font-size="20.88">S</tspan></text><text x="780" y="141" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">)</text><path d="M100,112 L110,81" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="100" cy="112" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="-17.5" data-max-x="237.5"><text x="110" y="54" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Cˢ · Software part</text><text x="110" y="75" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">This cohort-month</text></g><path d="M365,112 L375,81" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="365" cy="112" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="247.5" data-max-x="502.5"><text x="375" y="54" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">A · Original owners</text><text x="375" y="75" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">1,000 here</text></g><path d="M620,112 L700,81" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="620" cy="112" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="572.5" data-max-x="827.5"><text x="700" y="54" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">b · Net monthly payment</text><text x="700" y="75" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">€3 per paid account</text></g><path d="M252,161 L210,175" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="252" cy="161" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="85.0" data-max-x="335.0"><text x="210" y="194" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">κ · Paid starts</text><text x="210" y="215" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Share of all new owners</text></g><path d="M480,161 L465,175" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="480" cy="161" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="340.0" data-max-x="590.0"><text x="465" y="194" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">ηᵃ · Billing continuation</text><text x="465" y="215" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">η = 95%/month; a = 1</text></g><path d="M728,161 L730,175" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="728" cy="161" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="605.0" data-max-x="855.0"><text x="730" y="194" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">v_S · Extra account cost</text><text x="730" y="215" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">€0.50 per paid month</text></g><rect x="20" y="232" width="860" height="42" rx="8" fill="#fff1e9"/><text x="450" y="261" text-anchor="middle" font-size="22" fill="#913f20" font-weight="700">15% × 1,000 × 95%¹ × ( €3 − €0.50 ) = €356.25</text><text x="450" y="297" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">Month 2 software component; acquisition, shared work and fixed costs accounted for separately.</text></g></svg>
