<svg xmlns="http://www.w3.org/2000/svg" width="900" height="267" viewBox="0 0 900 267" role="img" aria-labelledby="title desc"><title id="title">A new opportunity needs a genuine payment right</title><desc id="desc">80 percent continuation and 10 percent reset applied to 100 completed owners gives 8 newly eligible owners. Existing owner identity remains; another fee needs its own valid payment condition.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="265" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">A new opportunity needs a genuine payment right</text><rect x="20" y="44" width="860" height="58" rx="9" fill="#173247"/><text x="115" y="85" text-anchor="middle" font-size="36" fill="#9be7dc" font-weight="700">ΔE</text><text x="220" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">=</text><text x="305" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">ρ<tspan baseline-shift="sub" font-size="20.88">M</tspan></text><text x="382" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="457" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">λ</text><text x="532" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="590" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">(</text><text x="645" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">M</text><text x="705" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">+</text><text x="765" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">L</text><text x="822" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">)</text><path d="M115,105 L112,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="115" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="8.0" data-max-x="216.0"><text x="112" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">ΔE · New eligibility</text><text x="112" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Existing owners return</text></g><path d="M305,105 L338,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="305" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="234.0" data-max-x="442.0"><text x="338" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">ρ_M · Continue</text><text x="338" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">After first fee</text></g><path d="M457,105 L550,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="457" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="446.0" data-max-x="654.0"><text x="550" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">λ · Reset</text><text x="550" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Share gaining a new right</text></g><path d="M705,105 L780,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="705" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="676.0" data-max-x="884.0"><text x="780" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">M + L · Completed</text><text x="780" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Existing + newly completed</text></g><rect x="20" y="182" width="860" height="42" rx="8" fill="#fff1e9"/><text x="450" y="211" text-anchor="middle" font-size="22" fill="#913f20" font-weight="700">80% × 10% × ( 0 + 100 ) = 8 newly eligible owners</text><text x="450" y="248" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">Next month: E = 720 + 8 = 728; M = 80 − 8 = 72. Eligibility is not another earned fee.</text></g></svg>
