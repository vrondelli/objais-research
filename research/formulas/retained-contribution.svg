<svg xmlns="http://www.w3.org/2000/svg" width="900" height="287" viewBox="0 0 900 287" role="img" aria-labelledby="title desc"><title id="title">From monthly results to contribution per owner</title><desc id="desc">Sum all monthly group contributions at a one percent monthly discount, then divide by the original cohort. Acquisition is already included once in month 1. Result 1.17 euros before fixed costs.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="285" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">From monthly results to contribution per owner</text><rect x="20" y="44" width="860" height="82" rx="9" fill="#173247"/><text x="92" y="99" text-anchor="middle" font-size="36" fill="#9be7dc" font-weight="700">U<tspan baseline-shift="sub" font-size="20.88">36</tspan></text><text x="180" y="99" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">=</text><text x="267" y="99" text-anchor="middle" font-size="43" fill="#ffffff" font-weight="700">Σ</text><text x="267" y="60" text-anchor="middle" font-size="16" fill="white" font-weight="700">35</text><text x="267" y="119" text-anchor="middle" font-size="14" fill="white" font-weight="700">a = 0</text><text x="435" y="99" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">δ<tspan baseline-shift="super" font-size="20.88">a</tspan></text><text x="532" y="99" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">C<tspan baseline-shift="sub" font-size="20.88">a</tspan></text><text x="650" y="99" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">/</text><text x="810" y="99" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">A</text><path d="M92,129 L92,145" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="92" cy="129" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="5.0" data-max-x="179.0"><text x="92" y="164" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">U36 · Per owner</text><text x="92" y="185" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">36-month contribution</text></g><path d="M267,129 L272,145" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="267" cy="129" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="185.0" data-max-x="359.0"><text x="272" y="164" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Σ · Add months</text><text x="272" y="185" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">a = 0 through 35</text></g><path d="M435,129 L452,145" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="435" cy="129" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="365.0" data-max-x="539.0"><text x="452" y="164" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">δᵃ · Time weight</text><text x="452" y="185" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">δ = 1 / 1.01</text></g><path d="M532,129 L632,145" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="532" cy="129" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="545.0" data-max-x="719.0"><text x="632" y="164" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">C_a · Month result</text><text x="632" y="185" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Net group result</text></g><path d="M810,129 L812,145" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="810" cy="129" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="725.0" data-max-x="899.0"><text x="812" y="164" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">A · Original group</text><text x="812" y="185" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">All 1,000 acquired</text></g><rect x="20" y="201" width="860" height="42" rx="8" fill="#fff1e9"/><text x="450" y="230" text-anchor="middle" font-size="22" fill="#913f20" font-weight="700">( −€2,400 + €1,128 / 1.01 + … ) / 1,000 = +€1.17</text><text x="450" y="269" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">Includes all 36 months. Acquisition charged once at joining; fixed overhead excluded.</text></g></svg>
