<svg xmlns="http://www.w3.org/2000/svg" width="900" height="247" viewBox="0 0 900 247" role="img" aria-labelledby="title desc"><title id="title">Retention before and after the first fee</title><desc id="desc">E waits for a first fee; M has already earned Objais a fee; L is new paid leads. At 80 percent continuation, next month has 720 waiting owners and 80 completed owners, without dormancy or reset.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="245" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">Retention before and after the first fee</text><rect x="20" y="44" width="415" height="58" rx="9" fill="#173247"/><rect x="465" y="44" width="415" height="58" rx="9" fill="#173247"/><text x="74" y="85" text-anchor="middle" font-size="27" fill="#9be7dc" font-weight="700">E<tspan baseline-shift="sub" font-size="15.659999999999998">next</tspan></text><text x="143" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">=</text><text x="205" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">ρ<tspan baseline-shift="sub" font-size="15.659999999999998">E</tspan></text><text x="254" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">×</text><text x="280" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">(</text><text x="305" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">E</text><text x="340" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">−</text><text x="371" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">L</text><text x="401" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">)</text><path d="M74,105 L67,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="74" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="14.0" data-max-x="120.0"><text x="67" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Next E</text><text x="67" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Awaiting fee</text></g><path d="M205,105 L190,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="205" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="137.0" data-max-x="243.0"><text x="190" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">ρ_E · Stay</text><text x="190" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Before fee</text></g><path d="M305,105 L295,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="305" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="242.0" data-max-x="348.0"><text x="295" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">E · Now</text><text x="295" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Awaiting fee</text></g><path d="M371,105 L393,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="371" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="340.0" data-max-x="446.0"><text x="393" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">L · Leads</text><text x="393" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Payable now</text></g><text x="227" y="198" text-anchor="middle" font-size="21" fill="#173247" font-weight="700">80% × (1,000 − 100) = 720</text><text x="519" y="85" text-anchor="middle" font-size="27" fill="#9be7dc" font-weight="700">M<tspan baseline-shift="sub" font-size="15.659999999999998">next</tspan></text><text x="588" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">=</text><text x="650" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">ρ<tspan baseline-shift="sub" font-size="15.659999999999998">M</tspan></text><text x="699" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">×</text><text x="725" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">(</text><text x="750" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">M</text><text x="785" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">+</text><text x="816" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">L</text><text x="846" y="85" text-anchor="middle" font-size="27" fill="#ffffff" font-weight="700">)</text><path d="M519,105 L512,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="519" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="459.0" data-max-x="565.0"><text x="512" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Next M</text><text x="512" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Fee earned</text></g><path d="M650,105 L635,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="650" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="582.0" data-max-x="688.0"><text x="635" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">ρ_M · Stay</text><text x="635" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">After fee</text></g><path d="M750,105 L740,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="750" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="687.0" data-max-x="793.0"><text x="740" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">M · Now</text><text x="740" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Fee earned</text></g><path d="M816,105 L838,119" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="816" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="785.0" data-max-x="891.0"><text x="838" y="138" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">L · Leads</text><text x="838" y="159" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Payable now</text></g><text x="672" y="198" text-anchor="middle" font-size="21" fill="#173247" font-weight="700">80% × (0 + 100) = 80</text><text x="450" y="230" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">Fee earnings belong to Objais. This simple case has no dormant return and no eligibility reset (λ = 0).</text></g></svg>
