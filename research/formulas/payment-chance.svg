<svg xmlns="http://www.w3.org/2000/svg" width="900" height="211" viewBox="0 0 900 211" role="img" aria-labelledby="title desc"><title id="title">Chance of earning the first fee</title><desc id="desc">q: first-fee chance per eligible owner-month; n: need; p: qualified request given need; alpha: contractual fee earned given a qualified request.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="209" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">Chance of earning the first fee</text><rect x="20" y="44" width="860" height="58" rx="9" fill="#173247"/><text x="180" y="85" text-anchor="middle" font-size="42" fill="#9be7dc" font-weight="700">q</text><text x="270" y="85" text-anchor="middle" font-size="42" fill="#ffffff" font-weight="700">=</text><text x="360" y="85" text-anchor="middle" font-size="42" fill="#ffffff" font-weight="700">n</text><text x="450" y="85" text-anchor="middle" font-size="42" fill="#ffffff" font-weight="700">×</text><text x="535" y="85" text-anchor="middle" font-size="42" fill="#ffffff" font-weight="700">p</text><text x="620" y="85" text-anchor="middle" font-size="42" fill="#ffffff" font-weight="700">×</text><text x="715" y="85" text-anchor="middle" font-size="42" fill="#ffffff" font-weight="700">α</text><path d="M180,105 L150,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="180" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="52.5" data-max-x="247.5"><text x="150" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">q · First-fee chance</text><text x="150" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per eligible owner-month</text></g><path d="M360,105 L350,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="360" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="252.5" data-max-x="447.5"><text x="350" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">n · Needs help</text><text x="350" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">This month</text></g><path d="M535,105 L550,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="535" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="452.5" data-max-x="647.5"><text x="550" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">p · Qualified request</text><text x="550" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Given that need</text></g><path d="M715,105 L750,121" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="715" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="652.5" data-max-x="847.5"><text x="750" y="140" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">α · Objais earns</text><text x="750" y="161" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Given a qualified request</text></g><text x="450" y="193" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">Conditional chances; payment-history limits and delivery capacity still apply.</text></g></svg>
