<svg xmlns="http://www.w3.org/2000/svg" width="900" height="267" viewBox="0 0 900 267" role="img" aria-labelledby="title desc"><title id="title">Renewal revenue at the first annual due date</title><desc id="desc">For one original policy group at age 12 months: payment rights times 100 started policies times 98 percent monthly eligibility to power 12 times 15 euro renewal fee, earning 1177.08 euros before policy costs. Without rights, zero.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="265" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">Renewal revenue at the first annual due date</text><rect x="20" y="44" width="860" height="58" rx="9" fill="#173247"/><text x="92" y="85" text-anchor="middle" font-size="36" fill="#9be7dc" font-weight="700">R<tspan baseline-shift="super" font-size="20.88">π</tspan></text><text x="184" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">=</text><text x="277" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">z<tspan baseline-shift="sub" font-size="20.88">π</tspan></text><text x="365" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="452" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">B</text><text x="545" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="635" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">ζ<tspan baseline-shift="sub" font-size="20.88">12</tspan></text><text x="718" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">×</text><text x="810" y="85" text-anchor="middle" font-size="36" fill="#ffffff" font-weight="700">φ<tspan baseline-shift="super" font-size="20.88">π</tspan></text><path d="M92,105 L92,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="92" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="5.5" data-max-x="178.5"><text x="92" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">Rπ · Renewal fees</text><text x="92" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Original policy group</text></g><path d="M277,105 L277,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="277" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="190.5" data-max-x="363.5"><text x="277" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">zπ · Payment right</text><text x="277" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Granted = 1; else 0</text></g><path d="M452,105 L452,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="452" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="365.5" data-max-x="538.5"><text x="452" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">B · Policies started</text><text x="452" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">100 from 1,000 owners</text></g><path d="M635,105 L635,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="635" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="548.5" data-max-x="721.5"><text x="635" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">ζ12 · Eligible</text><text x="635" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">After 12 months</text></g><path d="M810,105 L810,122" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="810" cy="105" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="723.5" data-max-x="896.5"><text x="810" y="141" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">φπ · Renewal fee</text><text x="810" y="162" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">€15 per renewal</text></g><rect x="20" y="183" width="860" height="42" rx="8" fill="#fff1e9"/><text x="450" y="212" text-anchor="middle" font-size="22" fill="#913f20" font-weight="700">1 × 100 × 0.98¹² × €15 = €1,177.08 renewal revenue</text><text x="450" y="249" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">Month 13, before policy costs. No renewal payment right (zπ = 0) means €0 earned.</text></g></svg>
