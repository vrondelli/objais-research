<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315" role="img" aria-labelledby="title desc"><title id="title">One-visit contribution per acquired owner</title><desc id="desc">C/A is group contribution per acquired owner, with fee reversals and processing deducted before multiplying by payment chance, then owner service and acquisition deducted. Numerical result minus 2.40 euros, before overhead.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#007d89"/></marker></defs><rect x="1" y="1" width="898" height="313" rx="12" fill="white" stroke="#cbdce2"/><g font-family="Arial, sans-serif"><text x="450" y="28" text-anchor="middle" font-size="22" fill="#173247" font-weight="700">One-visit contribution per acquired owner</text><rect x="20" y="100" width="860" height="58" rx="9" fill="#173247"/><text x="89" y="141" text-anchor="middle" font-size="34" fill="#9be7dc" font-weight="700">C / A</text><text x="160" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">=</text><text x="208" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">q</text><text x="245" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">×</text><text x="274" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">[</text><text x="303" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">f</text><text x="338" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">×</text><text x="370" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">(</text><text x="394" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">1</text><text x="428" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">−</text><text x="468" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">ω</text><text x="502" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">)</text><text x="535" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">−</text><text x="570" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">h</text><text x="601" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">]</text><text x="633" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">−</text><text x="730" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">−</text><text x="792" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">k</text><text x="680" y="141" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">v<tspan baseline-shift="sub" font-size="19.72">E</tspan></text><path d="M89,111 L95,81" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="89" cy="111" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="-2.5" data-max-x="192.5"><text x="95" y="54" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">C / A · Result</text><text x="95" y="75" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per acquired owner</text></g><path d="M303,111 L305,81" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="303" cy="111" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="207.5" data-max-x="402.5"><text x="305" y="54" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">f · Fee</text><text x="305" y="75" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per payable event</text></g><path d="M570,111 L575,81" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="570" cy="111" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="477.5" data-max-x="672.5"><text x="575" y="54" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">h · Processing</text><text x="575" y="75" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per payable event</text></g><path d="M792,111 L795,81" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="792" cy="111" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="697.5" data-max-x="892.5"><text x="795" y="54" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">k · Acquisition</text><text x="795" y="75" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per new owner</text></g><path d="M208,161 L200,175" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="208" cy="161" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="87.5" data-max-x="312.5"><text x="200" y="194" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">q · Payment chance</text><text x="200" y="215" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Share earning a first fee</text></g><path d="M468,161 L450,175" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="468" cy="161" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="337.5" data-max-x="562.5"><text x="450" y="194" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">ω · Reversals</text><text x="450" y="215" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Share of fees withdrawn</text></g><path d="M680,161 L710,175" stroke="#007d89" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="680" cy="161" r="2.3" fill="#007d89"/><g class="annotation" data-min-x="597.5" data-max-x="822.5"><text x="710" y="194" text-anchor="middle" font-size="17" fill="#007d89" font-weight="700">v_E · Service cost</text><text x="710" y="215" text-anchor="middle" font-size="16" fill="#173247" font-weight="400">Per owner this month</text></g><rect x="20" y="232" width="860" height="42" rx="8" fill="#fff1e9"/><text x="450" y="261" text-anchor="middle" font-size="22" fill="#913f20" font-weight="700">10% × [ €20 × (1 − 5%) − €1 ] − €0.20 − €4 = −€2.40</text><text x="450" y="297" text-anchor="middle" font-size="15" fill="#425966" font-weight="400">One-visit example; fixed costs excluded. C is group contribution; A is original acquired owners.</text></g></svg>
